name: Deploy to Railway

# Requires a repository secret named RAILWAY_TOKEN.
# Create one at: Railway project -> Settings -> Tokens (a *project* token),
# then add it with:  gh secret set RAILWAY_TOKEN
# Without it the job fails fast with a clear message rather than half-deploying.

on:
  push:
    branches:
      - master
  # allows deploying a chosen commit by hand from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify RAILWAY_TOKEN is configured
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set - nothing was deployed."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Deploys the checked-out commit using railway.json
      # (builder: DOCKERFILE, dockerfilePath: /railway/Dockerfile).
      # --ci streams build logs and exits non-zero if the build fails, so a
      # broken image surfaces here instead of silently never rolling out.
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service erpnext --ci
